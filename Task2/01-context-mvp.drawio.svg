<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="790" viewBox="0 0 1480 790" role="img" aria-labelledby="diagram-title description" content="&lt;mxfile host=&quot;app.diagrams.net&quot; type=&quot;device&quot;&gt;&lt;diagram id=&quot;context-mvp&quot; name=&quot;MVP · контекст&quot;&gt;&lt;/diagram&gt;&lt;/mxfile&gt;">
  <title id="diagram-title">Запись на прием через портал</title>
  <desc id="description">Горизонт — два месяца. Пациент выбирает время, ресепшен видит ту же запись и напоминает о ней за день до приема.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 4 L 0 8 z" fill="#456070" />
    </marker>
    <marker id="accent" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 4 L 0 8 z" fill="#386F62" />
    </marker>
  </defs>
  <rect x="0" y="0" width="1480" height="790" fill="#FFFFFF" />
  <g id="frames" font-family="Arial, Helvetica, sans-serif">
    <rect id="footer-line" x="50" y="659" width="1380" height="1" rx="0" fill="#CBDAD9" stroke="none" stroke-width="0" />
  </g>
  <g id="relationships" font-family="Arial, Helvetica, sans-serif">
    <polyline points="340,260 493,260 493,330 590,330" fill="none" stroke="#456070" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)">
      <title>Выбирает слот и получает номер записи</title>
    </polyline>
    <polyline points="340,520 553,520 553,420 590,420" fill="none" stroke="#456070" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)">
      <title>Видит запись и отмечает напоминание</title>
    </polyline>
    <polyline points="930,330 1044,330 1044,261 1138,261" fill="none" stroke="#456070" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)">
      <title>Проверяет доменную учетную запись сотрудника</title>
    </polyline>
    <polyline points="134,483 134,317" fill="none" stroke="#386F62" stroke-width="2" stroke-linejoin="round" marker-end="url(#accent)">
      <title>Напоминает пациенту за день до приема</title>
    </polyline>
    <polyline points="340,566 1138,566" fill="none" stroke="#386F62" stroke-width="2" stroke-linejoin="round" marker-end="url(#accent)">
      <title>Сообщает врачу время завтрашнего приема</title>
    </polyline>
  </g>
  <g id="elements" font-family="Arial, Helvetica, sans-serif">
    <rect id="patient" x="50" y="205" width="290" height="112" rx="12" fill="#EBF2F9" stroke="#7391AF" stroke-width="1.65" />
    <text x="195.0" y="225.485" fill="#153B58" font-size="13" font-weight="700" text-anchor="middle">[Человек]</text>
    <text x="195.0" y="255.59" fill="#153B58" font-size="22" font-weight="700" text-anchor="middle">Пациент</text>
    <text x="195.0" y="283.52" fill="#203A4A" font-size="16" font-weight="400" text-anchor="middle">Видит свободное время</text>
    <text x="195.0" y="304.52" fill="#203A4A" font-size="16" font-weight="400" text-anchor="middle">и свои записи на прием.</text>
    <rect id="reception" x="50" y="483" width="290" height="116" rx="12" fill="#EBF2F9" stroke="#7391AF" stroke-width="1.65" />
    <text x="195.0" y="505.485" fill="#153B58" font-size="13" font-weight="700" text-anchor="middle">[Человек]</text>
    <text x="195.0" y="535.59" fill="#153B58" font-size="22" font-weight="700" text-anchor="middle">Сотрудник ресепшена</text>
    <text x="195.0" y="563.52" fill="#203A4A" font-size="16" font-weight="400" text-anchor="middle">Ведет расписание филиала</text>
    <text x="195.0" y="584.52" fill="#203A4A" font-size="16" font-weight="400" text-anchor="middle">и связывается с участниками.</text>
    <rect id="platform" x="590" y="293" width="340" height="169" rx="12" fill="#DDEFE9" stroke="#287364" stroke-width="2" />
    <text x="760.0" y="317.985" fill="#174D46" font-size="13" font-weight="700" text-anchor="middle">[Программная система]</text>
    <text x="760.0" y="348.09" fill="#174D46" font-size="22" font-weight="700" text-anchor="middle">Платформа клиники</text>
    <text x="760.0" y="375.09" fill="#174D46" font-size="22" font-weight="700" text-anchor="middle">«Медикаменте»</text>
    <text x="760.0" y="403.02" fill="#203A4A" font-size="16" font-weight="400" text-anchor="middle">Личный кабинет пациента,</text>
    <text x="760.0" y="424.02" fill="#203A4A" font-size="16" font-weight="400" text-anchor="middle">рабочее место ресепшена</text>
    <text x="760.0" y="445.02" fill="#203A4A" font-size="16" font-weight="400" text-anchor="middle">и единое расписание.</text>
    <rect id="ad" x="1138" y="205" width="290" height="112" rx="12" fill="#F6F4F0" stroke="#A5957D" stroke-width="1.65" />
    <text x="1283.0" y="225.485" fill="#544A3B" font-size="13" font-weight="700" text-anchor="middle">[Система клиники]</text>
    <text x="1283.0" y="255.59" fill="#544A3B" font-size="22" font-weight="700" text-anchor="middle">Active Directory</text>
    <text x="1283.0" y="283.52" fill="#203A4A" font-size="16" font-weight="400" text-anchor="middle">Корпоративный каталог</text>
    <text x="1283.0" y="304.52" fill="#203A4A" font-size="16" font-weight="400" text-anchor="middle">учетных записей сотрудников.</text>
    <rect id="doctor" x="1138" y="483" width="290" height="116" rx="12" fill="#EBF2F9" stroke="#7391AF" stroke-width="1.65" />
    <text x="1283.0" y="505.485" fill="#153B58" font-size="13" font-weight="700" text-anchor="middle">[Человек]</text>
    <text x="1283.0" y="535.59" fill="#153B58" font-size="22" font-weight="700" text-anchor="middle">Врач</text>
    <text x="1283.0" y="563.52" fill="#203A4A" font-size="16" font-weight="400" text-anchor="middle">Получает от ресепшена</text>
    <text x="1283.0" y="584.52" fill="#203A4A" font-size="16" font-weight="400" text-anchor="middle">напоминание о приеме.</text>
  </g>
  <g id="labels" font-family="Arial, Helvetica, sans-serif">
    <text x="50" y="41.019999999999996" fill="#286E61" font-size="16" font-weight="700" text-anchor="start">Медикаменте  /  MVP · через два месяца  /  C4 · уровень 1 · контекст системы</text>
    <text x="48" y="90.075" fill="#203A4A" font-size="35" font-weight="700" text-anchor="start">Запись на прием через портал</text>
    <text x="50" y="129.21" fill="#496272" font-size="18" font-weight="400" text-anchor="start">Горизонт — два месяца. Пациент выбирает время, ресепшен видит ту же запись и напоминает о ней за день до приема.</text>
    <text x="449.0" y="226.675" fill="#354F5E" font-size="15" font-weight="400" text-anchor="middle">Выбирает слот</text>
    <text x="449.0" y="245.675" fill="#354F5E" font-size="15" font-weight="400" text-anchor="middle">и получает номер записи</text>
    <text x="447.5" y="480.675" fill="#354F5E" font-size="15" font-weight="400" text-anchor="middle">Видит запись</text>
    <text x="447.5" y="499.675" fill="#354F5E" font-size="15" font-weight="400" text-anchor="middle">и отмечает напоминание</text>
    <text x="1032.0" y="223.675" fill="#354F5E" font-size="15" font-weight="400" text-anchor="middle">Проверяет доменную</text>
    <text x="1032.0" y="242.675" fill="#354F5E" font-size="15" font-weight="400" text-anchor="middle">учетную запись сотрудника</text>
    <text x="240.5" y="383.675" fill="#354F5E" font-size="15" font-weight="400" text-anchor="middle">Напоминает пациенту</text>
    <text x="240.5" y="402.675" fill="#354F5E" font-size="15" font-weight="400" text-anchor="middle">за день до приема</text>
    <text x="733.0" y="550.675" fill="#354F5E" font-size="15" font-weight="400" text-anchor="middle">Сообщает врачу время завтрашнего приема</text>
    <text x="50" y="688.365" fill="#286C60" font-size="17" font-weight="700" text-anchor="start">Граница MVP</text>
    <text x="50" y="716.52" fill="#496272" font-size="16" font-weight="400" text-anchor="start">Для записи нужны учетная запись пациента и контакт для напоминания. Карты, договоры и анализы остаются в файлах, платежи учитываются в 1С.</text>
    <text x="50" y="739.52" fill="#496272" font-size="16" font-weight="400" text-anchor="start">Доступ через кабинет к ранее заведенной карте появится через год, после проверки личности пациента и привязки карты.</text>
  </g>
</svg>
