<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="859" viewBox="0 0 1420 859" role="img" aria-labelledby="title desc" version="1.1" content="&lt;mxfile host=&quot;app.diagrams.net&quot; type=&quot;device&quot;&gt;&lt;diagram id=&quot;P08-management-reporting-as-is&quot; name=&quot;P08 · Управленческая отчетность&quot;&gt;&lt;/diagram&gt;&lt;/mxfile&gt;">
  <title id="title">P08. Управленческая отчетность — диаграмма потоков данных As-Is</title>
  <desc id="desc">Бизнес-аналитик клиники работает с таблицами Excel в Jupyter и использует Python. Схема раскрывает логику двух видов расчета. Доходы и расходы за период используются для отчета о прибыли и убытках (P&amp;L). Позиции и значения выбранного показателя используются для группировки по накопленной доле в ABC-анализе. Оба результата доступны аналитику. Исходные книги, место хранения рабочих материалов и дальнейшие получатели отчетов подлежат уточнению.</desc>
