      <rect x="1189" y="360" width="179" height="110" rx="0" fill="#F4F6F8" stroke="#6A8090" stroke-width="2" />
      <rect x="52" y="626" width="1316" height="1" fill="#CEDADD" />
    </g>
    <g id="captions">
      <text x="52" y="39.44" fill="#206962" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start">Медикаменте  /  Задание 1  /  DFD As-Is</text>
      <text x="50" y="91.26" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="39" font-weight="700" text-anchor="start">P08. Управленческая отчетность</text>
      <text x="52" y="131.8" fill="#415969" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">Бизнес-аналитик готовит отчеты на основе таблиц Excel и выполняет расчеты в Jupyter с помощью Python.</text>
      <text x="52" y="185.6" fill="#415969" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="start">Источник</text>
      <text x="347" y="185.6" fill="#415969" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="start">Подготовка данных</text>
      <text x="785" y="185.6" fill="#415969" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="start">Два вида расчета</text>
      <text x="1189" y="185.6" fill="#415969" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="start">Участник</text>
      <text x="139.0" y="412.64" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="middle">Исходные</text>
      <text x="139.0" y="439.64" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="middle">таблицы Excel</text>
      <text x="456.0" y="393.1" fill="#416681" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle">P08.1 · Jupyter / Python</text>
      <text x="456.0" y="419.14" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="middle">Отобрать строки</text>
      <text x="456.0" y="446.14" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="middle">и поля для отчета</text>
      <text x="909.0" y="296.1" fill="#416681" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle">P08.2 · P&amp;L</text>
      <text x="909.0" y="321.3" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Рассчитать прибыль</text>
      <text x="909.0" y="347.3" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="middle">или убыток за период</text>
      <text x="909.0" y="495.6" fill="#416681" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle">P08.3 · ABC-анализ</text>
      <text x="909.0" y="520.8" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Присвоить позициям</text>
      <text x="909.0" y="546.8" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="middle">группы A, B и C</text>
      <text x="909.0" y="568.6" fill="#415969" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle">По накопленной доле показателя</text>
      <text x="1278.5" y="410.96" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Бизнес-аналитик</text>
      <text x="1278.5" y="432.6" fill="#415969" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle">ИТ-отдел</text>
      <text x="286.5" y="404.4" fill="#375A70" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle">Строки таблиц</text>
      <text x="869.5" y="218.4" fill="#375A70" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle">Период отчета и показатель для ABC</text>
      <text x="687.0" y="306.4" fill="#375A70" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle">Доходы и расходы</text>
      <text x="687.0" y="516.4" fill="#375A70" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle">Позиции и значения</text>
      <text x="1100.0" y="306.4" fill="#375A70" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle">Отчет P&amp;L</text>
      <text x="1100.0" y="516.4" fill="#375A70" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle">Таблица ABC</text>
      <text x="52" y="674.14" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="start">Где проверить персональные данные</text>
      <text x="729" y="674.14" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="start">Что уточнить у аналитика</text>
      <text x="52" y="718.28" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">Если в Excel есть ФИО или телефон пациента, проверить,</text>
      <text x="729" y="718.28" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">Из каких книг и листов Excel берутся исходные данные?</text>
      <text x="52" y="746.28" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">видны ли они в рабочей выборке, в выводе ячеек Jupyter</text>
      <text x="729" y="746.28" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">Где хранятся блокноты и отчеты, у кого есть доступ к ним?</text>
      <text x="52" y="774.28" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">и в готовом отчете. Для обоих расчетов такие поля избыточны.</text>
      <text x="729" y="774.28" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">Кому и каким способом аналитик передает результаты?</text>
    </g>
