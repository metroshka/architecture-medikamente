    <g id="captions">
      <text x="52" y="39.44" fill="#206962" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start">Медикаменте  /  Задание 1  /  DFD As-Is</text>
      <text x="50" y="91.26" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="39" font-weight="700" text-anchor="start">P04. Учет анализов</text>
      <text x="52" y="131.8" fill="#415969" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">В клинике вручную ведут дневной реестр анализов. Как клиника обменивается данными с лабораторией, предстоит уточнить.</text>
      <text x="52" y="185.6" fill="#415969" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="start">Участники клиники</text>
      <text x="504" y="185.6" fill="#415969" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="start">Операции с данными</text>
      <text x="1002" y="185.6" fill="#415969" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="start">Общий файловый сервер</text>
      <text x="1002" y="375.6" fill="#415969" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="start">За пределами клиники</text>
      <text x="168.0" y="252.98" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Сотрудник клиники</text>
      <text x="168.0" y="275.1" fill="#415969" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle">Должность не указана</text>
      <text x="168.0" y="586.32" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="middle">Врач</text>
      <text x="168.0" y="608.6" fill="#415969" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle">Возможный получатель</text>
      <text x="646.0" y="247.6" fill="#416681" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle">P04.1 · Ручной учет</text>
      <text x="646.0" y="273.64" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="middle">Внести запись в реестр</text>
      <text x="646.0" y="419.6" fill="#895B29" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle">P04.2 · Допущение</text>
      <text x="646.0" y="445.64" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="middle">Передать направление</text>
      <text x="646.0" y="580.6" fill="#895B29" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle">P04.3 · Допущение</text>
      <text x="646.0" y="606.64" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="middle">Принять результат</text>
      <text x="1175.0" y="253.98" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Реестр анализов за день</text>
      <text x="1175.0" y="275.26" fill="#206962" font-family="Courier New, monospace" font-size="14" font-weight="400" text-anchor="middle">Laboratory Registry/RegistryByDate</text>
      <text x="1175.0" y="296.1" fill="#415969" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle">Excel на общем диске клиники</text>
      <text x="1162.0" y="454.64" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="middle">Медицинская лаборатория</text>
      <text x="1162.0" y="476.6" fill="#415969" font-family="Courier New, monospace" font-size="15" font-weight="400" text-anchor="middle">Laboratory</text>
      <text x="394.0" y="245.4" fill="#375A70" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle">Сведения об анализе</text>
      <text x="895.0" y="245.4" fill="#375A70" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle">Строка реестра</text>
      <text x="329.0" y="417.4" fill="#895B29" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle">Данные для направления</text>
      <text x="895.0" y="417.4" fill="#895B29" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle">Направление на анализ</text>
      <text x="983.0" y="578.4" fill="#895B29" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle">Результат исследования</text>
      <text x="394.0" y="578.4" fill="#895B29" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle">Результат для врача</text>
      <text x="52" y="698.14" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="start">Конфиденциальные данные</text>
      <text x="732" y="698.14" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="start">Как читать схему</text>
      <text x="52" y="735.28" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">Результат можно связать с пациентом по Ф. И. О. или по номеру</text>
      <text x="52" y="762.28" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">направления, если известно, кому оно выдано.</text>
      <text x="52" y="789.28" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">Состав колонок реестра и место хранения результатов неизвестны.</text>
      <text x="788" y="735.78" fill="#375A70" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">Подтвержденный ручной учет в Excel.</text>
      <text x="788" y="766.78" fill="#895B29" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">Предполагаемый маршрут или получатель.</text>
      <text x="732" y="803.28" fill="#415969" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">Уточнить канал передачи и способ привязки результата к пациенту.</text>
