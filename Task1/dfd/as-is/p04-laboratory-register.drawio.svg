<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="839" viewBox="0 0 1400 839" role="img" aria-labelledby="title desc" version="1.1" content="&lt;mxfile host=&quot;app.diagrams.net&quot; type=&quot;device&quot;&gt;&lt;diagram id=&quot;P04-laboratory-register-as-is&quot; name=&quot;P04 · Учет анализов&quot;&gt;&lt;/diagram&gt;&lt;/mxfile&gt;">
  <title id="title">P04. Учет анализов — диаграмма потоков данных As-Is</title>
  <desc id="desc">Сотрудник клиники вручную ведет дневной реестр анализов RegistryByDate в Excel на общем диске. Лаборатория — внешний участник. Передача направления, получение результата и его передача врачу показаны пунктиром как возможные маршруты. Состав реестра, текущий канал обмена и место хранения результатов неизвестны.</desc>
  <defs>
