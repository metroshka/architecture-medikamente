    <g id="captions">
      <text x="52" y="39.44" fill="#206962" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start">Медикаменте  /  Задание 1  /  DFD As-Is</text>
      <text x="50" y="91.26" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="39" font-weight="700" text-anchor="start">P03. Ведение медицинской карты</text>
      <text x="52" y="131.8" fill="#415969" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">Клиника ведет медицинские карты в Excel или хранит их в виде сканов на общем диске.</text>
      <text x="52" y="185.6" fill="#415969" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="start">Участники</text>
      <text x="514" y="185.6" fill="#415969" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="start">Ручные операции</text>
      <text x="1058" y="185.6" fill="#415969" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="start">Общий файловый сервер</text>
      <text x="157.0" y="262.82" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="middle">Ресепшен</text>
      <text x="157.0" y="375.32" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="middle">Пациент</text>
      <text x="157.0" y="397.6" fill="#415969" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle">Анкета по желанию</text>
      <text x="157.0" y="565.82" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="middle">Врач</text>
      <text x="664.0" y="246.6" fill="#416681" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle">P03.1 · Ресепшен</text>
      <text x="664.0" y="272.64" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="middle">Зарегистрировать файл</text>
      <text x="664.0" y="369.6" fill="#416681" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle">P03.2 · Сотрудник клиники</text>
      <text x="664.0" y="395.64" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="middle">Обработать анкету</text>
      <text x="664.0" y="492.6" fill="#416681" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle">P03.3 · Сотрудник клиники</text>
      <text x="664.0" y="518.64" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="middle">Оформить медкарту</text>
      <text x="664.0" y="624.6" fill="#416681" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle">P03.4 · Просмотр</text>
      <text x="664.0" y="650.64" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="middle">Открыть медкарту</text>
      <text x="1203.0" y="245.64" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="middle">Именная папка пациента</text>
      <text x="1203.0" y="266.76" fill="#206962" font-family="Courier New, monospace" font-size="14" font-weight="400" text-anchor="middle">Pacient1-FIO-BD</text>
      <text x="1203.0" y="287.6" fill="#415969" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle">Файлы пациента разных форматов</text>
      <text x="1203.0" y="599.48" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Медицинские карты</text>
      <text x="1203.0" y="622.44" fill="#206962" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle">Файлы Excel или сканы</text>
      <text x="1203.0" y="643.6" fill="#415969" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle">Точный каталог не указан</text>
      <text x="388.0" y="244.4" fill="#375A70" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle">Файл пациента</text>
      <text x="936.0" y="244.4" fill="#375A70" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle">Зарегистрированный файл</text>
      <text x="388.0" y="367.4" fill="#375A70" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle">Расширенная анкета</text>
      <text x="506.0" y="445.4" fill="#895B29" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle">Сведения из анкеты</text>
      <text x="979.0" y="426.4" fill="#895B29" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle">Документ из папки</text>
      <text x="408.0" y="490.4" fill="#895B29" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle">Сведения об осмотре</text>
      <text x="1006.0" y="490.4" fill="#375A70" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle">Медицинская карта</text>
      <text x="936.0" y="622.4" fill="#895B29" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle">Сохраненная карта</text>
      <text x="405.0" y="622.4" fill="#895B29" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle">Сведения из карты</text>
      <text x="52" y="744.64" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="start">Где видны конфиденциальные данные</text>
      <text x="52" y="785.78" fill="#206962" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="start">Содержимое карты и анкеты</text>
      <text x="52" y="807.78" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">В карте содержатся сведения о здоровье. В расширенной анкете</text>
      <text x="52" y="830.78" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">пациент может указать хронические заболевания.</text>
      <text x="52" y="861.78" fill="#206962" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="start">Имя папки на общем диске</text>
      <text x="52" y="886.78" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">Ф. И. О. и дата рождения видны уже в списке папок.</text>
      <text x="732" y="744.64" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="start">Как читать схему</text>
      <text x="788" y="786.78" fill="#375A70" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">Связь подтверждена описанием системы.</text>
      <text x="788" y="816.78" fill="#895B29" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">Маршрут или роль требуют подтверждения.</text>
      <text x="732" y="854.28" fill="#415969" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">Карта и именная папка находятся на общем сервере.</text>
      <text x="732" y="881.28" fill="#415969" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">Просмотр и изменение документов не журналируются.</text>
    </g>
  </g>
