      <polyline points="262,533 304,533 304,501 514,501" stroke="#895B29" fill="none" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow-assumed)" stroke-dasharray="8 5" />
      <polyline points="814,501 1203,501 1203,539" stroke="#375A70" fill="none" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow)" />
      <polyline points="1058,633 814,633" stroke="#895B29" fill="none" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow-assumed)" stroke-dasharray="8 5" />
