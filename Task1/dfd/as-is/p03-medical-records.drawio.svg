      <path d="M 1058 212 C 1058 194.66666666666666 1348 194.66666666666666 1348 212 L 1348 298 C 1348 315.3333333333333 1058 315.3333333333333 1058 298 Z" fill="#E7F4EE" stroke="#398277" stroke-width="2" />
