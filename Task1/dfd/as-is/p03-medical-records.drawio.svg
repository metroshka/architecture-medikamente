<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="916" viewBox="0 0 1400 916" role="img" aria-labelledby="title desc" version="1.1" content="&lt;mxfile host=&quot;app.diagrams.net&quot; type=&quot;device&quot;&gt;&lt;diagram id=&quot;P03-medical-records-as-is&quot; name=&quot;P03 · Ведение медицинской карты&quot;&gt;&lt;/diagram&gt;&lt;/mxfile&gt;">
  <title id="title">P03. Ведение медицинской карты — диаграмма потоков данных As-Is</title>
  <desc id="desc">Ресепшен регистрирует файлы в именной папке пациента. Сотрудники обрабатывают расширенную анкету по желанию пациента. Медицинские карты хранятся на общем диске в Excel или в виде сканов. Пунктиром показаны возможная передача сведений в медкарту и ее просмотр врачом. Точный каталог, где лежит карта, требует подтверждения.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 11 10" refX="10" refY="5" markerWidth="11" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#375A70" />
    </marker>
    <marker id="arrow-assumed" viewBox="0 0 11 10" refX="10" refY="5" markerWidth="11" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#895B29" />
    </marker>
  </defs>
  <rect x="0" y="0" width="1400" height="916" fill="#FFFFFF" />
