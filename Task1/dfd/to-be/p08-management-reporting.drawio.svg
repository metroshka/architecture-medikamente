<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="1203" viewBox="0 0 1420 1203" role="img" aria-labelledby="title desc" version="1.1" content="&lt;mxfile host=&quot;app.diagrams.net&quot; type=&quot;device&quot;&gt;&lt;diagram id=&quot;p08-protection&quot; name=&quot;P08. Меры защиты&quot;&gt;&lt;/diagram&gt;&lt;/mxfile&gt;">
  <title id="title">P08. Управленческая отчетность — потоки данных и предлагаемые меры защиты</title>
  <desc id="desc">Бизнес-аналитик клиники работает с таблицами Excel в Jupyter и использует Python. Схема раскрывает логику двух видов расчета. Доходы и расходы за период используются для отчета о прибыли и убытках (P&amp;L). Позиции и значения выбранного показателя используются для группировки по накопленной доле в ABC-анализе. Оба результата доступны аналитику. Исходные книги, место хранения рабочих материалов и дальнейшие получатели отчетов подлежат уточнению. Вверху показан исходный поток, внизу — предлагаемые меры по номерам операций.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 11 10" refX="10" refY="5" markerWidth="11" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#375A70" />
    </marker>
    <marker id="arrow-assumed" viewBox="0 0 11 10" refX="10" refY="5" markerWidth="11" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#895B29" />
    </marker>
  </defs>
  <rect x="0" y="0" width="1420" height="1203" fill="#FFFFFF" />
  <g font-family="Arial, Helvetica, sans-serif">
    <g id="lines">
      <polyline points="226,415 347,415" stroke="#375A70" fill="none" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow)" />
      <polyline points="1278.5,360 1278.5,229 456,229 456,360" stroke="#375A70" fill="none" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow)" />
      <polyline points="565,386 589,386 589,317 785,317" stroke="#375A70" fill="none" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow)" />
      <polyline points="565,444 589,444 589,527 785,527" stroke="#375A70" fill="none" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow)" />
      <polyline points="1033,317 1167,317 1167,392 1189,392" stroke="#375A70" fill="none" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow)" />
      <polyline points="1033,527 1167,527 1167,442 1189,442" stroke="#375A70" fill="none" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow)" />
    </g>
    <g id="shapes">
      <rect x="52" y="155" width="1316" height="1" fill="#CEDADD" />
      <path d="M 52 369 C 52 351.6666666666667 226 351.6666666666667 226 369 L 226 461 C 226 478.3333333333333 52 478.3333333333333 52 461 Z" fill="#E7F4EE" stroke="#398277" stroke-width="2" />
      <path d="M 52 369 C 52 386.29 226 386.29 226 369" fill="none" stroke="#398277" stroke-width="1.4" />
      <rect x="347" y="360" width="218" height="110" rx="12" fill="#ECF3FA" stroke="#507999" stroke-width="2" />
      <rect x="785" y="262" width="248" height="110" rx="12" fill="#ECF3FA" stroke="#507999" stroke-width="2" />
      <rect x="785" y="463" width="248" height="128" rx="12" fill="#ECF3FA" stroke="#507999" stroke-width="2" />
      <rect x="1189" y="360" width="179" height="110" rx="0" fill="#F4F6F8" stroke="#6A8090" stroke-width="2" />
      <rect x="52" y="626" width="1316" height="1" fill="#CEDADD" />
    </g>
    <g id="captions">
      <text x="52" y="39.44" fill="#206962" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start">Медикаменте  /  P08  /  Сверху — исходный поток, снизу — предлагаемые меры по номерам операций</text>
      <text x="50" y="91.26" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="39" font-weight="700" text-anchor="start">P08. Управленческая отчетность</text>
      <text x="52" y="131.8" fill="#415969" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">Сейчас бизнес-аналитик готовит отчеты на основе таблиц Excel и выполняет расчеты в Jupyter с помощью Python.</text>
      <text x="52" y="185.6" fill="#415969" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="start">Источник</text>
      <text x="347" y="185.6" fill="#415969" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="start">Подготовка данных</text>
      <text x="785" y="185.6" fill="#415969" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="start">Два вида расчета</text>
      <text x="1189" y="185.6" fill="#415969" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="start">Участник</text>
      <text x="139.0" y="412.64" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="middle">Исходные</text>
      <text x="139.0" y="439.64" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="middle">таблицы Excel</text>
      <text x="456.0" y="393.1" fill="#416681" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle">P08.1 · Jupyter / Python<title>Передать аналитику отдельную книгу с нужными столбцами. Убрать ФИО и телефоны до загрузки в Jupyter. Рабочие файлы и вывод ячеек держать в закрытой папке.</title></text>
      <text x="456.0" y="419.14" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="middle">Отобрать строки</text>
      <text x="456.0" y="446.14" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="middle">и поля для отчета</text>
      <text x="909.0" y="296.1" fill="#416681" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle">P08.2 · P&amp;L<title>Для расчета использовать период, статьи, доходы и расходы. Проверить листы и вывод блокнота. Готовый отчет с финансовой меткой выдать согласованному получателю.</title></text>
      <text x="909.0" y="321.3" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Рассчитать прибыль</text>
      <text x="909.0" y="347.3" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="middle">или убыток за период</text>
      <text x="909.0" y="495.6" fill="#416681" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle">P08.3 · ABC-анализ<title>Взять код позиции и показатель для ранжирования. Для данных пациентов проверить редкие группы и соседние срезы. Объединить группы, по которым можно узнать человека.</title></text>
      <text x="909.0" y="520.8" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Присвоить позициям</text>
      <text x="909.0" y="546.8" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="middle">группы A, B и C</text>
      <text x="909.0" y="568.6" fill="#415969" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle">По накопленной доле показателя</text>
      <text x="1278.5" y="410.96" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Бизнес-аналитик</text>
      <text x="1278.5" y="432.6" fill="#415969" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle">ИТ-отдел</text>
      <text x="286.5" y="404.4" fill="#375A70" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle">Строки таблиц</text>
      <text x="869.5" y="218.4" fill="#375A70" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle">Период отчета и показатель для ABC</text>
      <text x="687.0" y="306.4" fill="#375A70" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle">Доходы и расходы</text>
      <text x="687.0" y="516.4" fill="#375A70" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle">Позиции и значения</text>
      <text x="1100.0" y="306.4" fill="#375A70" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle">Отчет P&amp;L</text>
      <text x="1100.0" y="516.4" fill="#375A70" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle">Таблица ABC</text>
      <text x="52" y="674.14" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="start">Где проверить персональные данные</text>
      <text x="729" y="674.14" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="start">Что уточнить у аналитика</text>
      <text x="52" y="718.28" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">Если в Excel есть ФИО или телефон пациента, проверить,</text>
      <text x="729" y="718.28" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">Из каких книг и листов Excel берутся исходные данные?</text>
      <text x="52" y="746.28" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">видны ли они в рабочей выборке, в выводе ячеек Jupyter</text>
      <text x="729" y="746.28" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">Где хранятся блокноты и отчеты, у кого есть доступ к ним?</text>
      <text x="52" y="774.28" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">и в готовом отчете. Для обоих расчетов такие поля избыточны.</text>
      <text x="729" y="774.28" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">Кому и каким способом аналитик передает результаты?</text>
    </g>
  </g>
  <g id="protection" font-family="Arial, Helvetica, sans-serif">
    <rect x="52" y="859" width="1316" height="1" fill="#9ABEB4" />
    <text x="52" y="892" fill="#155B51" font-size="24" font-weight="700">Предлагаемые меры по этапам</text>
    <g id="protection-1">
      <rect x="52" y="911" width="649" height="121" rx="8" fill="#F0F7F4" stroke="#AAC7BE" />
      <text x="68" y="936" fill="#155B51" font-size="18" font-weight="700">P08.1  ·  Подготовка выборки</text>
      <text x="68" y="961" fill="#243F4A" font-size="16" font-weight="400">Передать аналитику отдельную книгу с нужными столбцами. Убрать ФИО</text>
      <text x="68" y="984" fill="#243F4A" font-size="16" font-weight="400">и телефоны до загрузки в Jupyter. Рабочие файлы и вывод ячеек</text>
      <text x="68" y="1007" fill="#243F4A" font-size="16" font-weight="400">держать в закрытой папке.</text>
    </g>
    <g id="protection-2">
      <rect x="719" y="911" width="649" height="121" rx="8" fill="#F0F7F4" stroke="#AAC7BE" />
      <text x="735" y="936" fill="#155B51" font-size="18" font-weight="700">P08.2  ·  Расчет P&amp;L</text>
      <text x="735" y="961" fill="#243F4A" font-size="16" font-weight="400">Для расчета использовать период, статьи, доходы и расходы.</text>
      <text x="735" y="984" fill="#243F4A" font-size="16" font-weight="400">Проверить листы и вывод блокнота. Готовый отчет с финансовой</text>
      <text x="735" y="1007" fill="#243F4A" font-size="16" font-weight="400">меткой выдать согласованному получателю.</text>
    </g>
    <g id="protection-3">
      <rect x="52" y="1050" width="649" height="121" rx="8" fill="#F0F7F4" stroke="#AAC7BE" />
      <text x="68" y="1075" fill="#155B51" font-size="18" font-weight="700">P08.3  ·  ABC-анализ</text>
      <text x="68" y="1100" fill="#243F4A" font-size="16" font-weight="400">Взять код позиции и показатель для ранжирования. Для данных</text>
      <text x="68" y="1123" fill="#243F4A" font-size="16" font-weight="400">пациентов проверить редкие группы и соседние срезы. Объединить</text>
      <text x="68" y="1146" fill="#243F4A" font-size="16" font-weight="400">группы, по которым можно узнать человека.</text>
    </g>
    <g id="protection-4">
      <rect x="719" y="1050" width="649" height="121" rx="8" fill="#F0F7F4" stroke="#AAC7BE" />
      <text x="735" y="1075" fill="#155B51" font-size="18" font-weight="700">Выдача отчета</text>
      <text x="735" y="1100" fill="#243F4A" font-size="16" font-weight="400">Проверить, можно ли узнать человека из итоговых групп или по</text>
      <text x="735" y="1123" fill="#243F4A" font-size="16" font-weight="400">разнице двух отчетов. Зафиксировать получателя и набор источников.</text>
      <text x="735" y="1146" fill="#243F4A" font-size="16" font-weight="400">Удалить рабочую выборку по сроку.</text>
    </g>
  </g>
</svg>