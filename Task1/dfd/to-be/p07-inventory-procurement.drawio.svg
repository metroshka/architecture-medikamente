<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="1203" viewBox="0 0 1420 1203" role="img" aria-labelledby="title desc" version="1.1" content="&lt;mxfile host=&quot;app.diagrams.net&quot; type=&quot;device&quot;&gt;&lt;diagram id=&quot;p07-protection&quot; name=&quot;P07. Меры защиты&quot;&gt;&lt;/diagram&gt;&lt;/mxfile&gt;">
  <title id="title">P07. Складской учет и закупки — потоки данных и предлагаемые меры защиты</title>
  <desc id="desc">Сотрудник склада регистрирует сведения о ТМЦ и закупках оборудования в файловой базе 1С:Торговля и склад. На сервере клиники также размещена отдельная файловая база 1С:Бухгалтерия предприятия. Данные склада передаются в бухгалтерию через OLE, а данные бухгалтерии через OLE поступают в складскую базу. Поля каждой передачи и периодичность обмена подлежат уточнению. Вверху показан исходный поток, внизу — предлагаемые меры по номерам операций.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 11 10" refX="10" refY="5" markerWidth="11" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#375A70" />
    </marker>
    <marker id="arrow-assumed" viewBox="0 0 11 10" refX="10" refY="5" markerWidth="11" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#895B29" />
    </marker>
  </defs>
  <rect x="0" y="0" width="1420" height="1203" fill="#FFFFFF" />
  <g font-family="Arial, Helvetica, sans-serif">
    <g id="lines">
      <polyline points="288,284 322,284 322,254 510,254" stroke="#375A70" fill="none" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow)" />
      <polyline points="288,330 322,330 322,384 510,384" stroke="#375A70" fill="none" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow)" />
      <polyline points="815,254 1016,254 1016,278 1054,278" stroke="#375A70" fill="none" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow)" />
      <polyline points="815,384 1016,384 1016,350 1054,350" stroke="#375A70" fill="none" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow)" />
      <polyline points="1160,394 1160,535 815,535" stroke="#375A70" fill="none" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow)" />
      <polyline points="510,535 322,535" stroke="#375A70" fill="none" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow)" />
      <polyline points="322,598 510,598" stroke="#375A70" fill="none" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow)" />
      <polyline points="815,598 1280,598 1280,394" stroke="#375A70" fill="none" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow)" />
    </g>
    <g id="shapes">
      <rect x="52" y="155" width="1316" height="1" fill="#CEDADD" />
      <rect x="52" y="262" width="236" height="90" rx="0" fill="#F4F6F8" stroke="#6A8090" stroke-width="2" />
      <rect x="510" y="212" width="305" height="84" rx="12" fill="#ECF3FA" stroke="#507999" stroke-width="2" />
      <rect x="510" y="339" width="305" height="90" rx="12" fill="#ECF3FA" stroke="#507999" stroke-width="2" />
      <path d="M 1054 245 C 1054 227.66666666666666 1368 227.66666666666666 1368 245 L 1368 381 C 1368 398.3333333333333 1054 398.3333333333333 1054 381 Z" fill="#E7F4EE" stroke="#398277" stroke-width="2" />
      <path d="M 1054 245 C 1054 262.29 1368 262.29 1368 245" fill="none" stroke="#398277" stroke-width="1.4" />
      <path d="M 52 517 C 52 499.6666666666667 322 499.6666666666667 322 517 L 322 616 C 322 633.3333333333334 52 633.3333333333334 52 616 Z" fill="#E7F4EE" stroke="#398277" stroke-width="2" />
      <path d="M 52 517 C 52 534.29 322 534.29 322 517" fill="none" stroke="#398277" stroke-width="1.4" />
      <rect x="510" y="508" width="305" height="116" rx="12" fill="#ECF3FA" stroke="#507999" stroke-width="2" />
      <rect x="52" y="664" width="1316" height="1" fill="#CEDADD" />
    </g>
    <g id="captions">
      <text x="52" y="39.44" fill="#206962" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start">Медикаменте  /  P07  /  Сверху — исходный поток, снизу — предлагаемые меры по номерам операций</text>
      <text x="50" y="91.26" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="39" font-weight="700" text-anchor="start">P07. Складской учет и закупки</text>
      <text x="52" y="131.8" fill="#415969" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">Склад учитывает товарно-материальные ценности (ТМЦ) и закупки оборудования для медицинских кабинетов.</text>
      <text x="52" y="185.6" fill="#415969" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="start">Участник</text>
      <text x="510" y="185.6" fill="#415969" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="start">Операции склада</text>
      <text x="1054" y="185.6" fill="#415969" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="start">Хранилище склада</text>
      <text x="52" y="474.6" fill="#415969" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="start">Хранилище бухгалтерии</text>
      <text x="510" y="474.6" fill="#415969" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="start">Обмен между базами 1С</text>
      <text x="170.0" y="314.48" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Сотрудник склада</text>
      <text x="662.5" y="245.1" fill="#416681" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle">P07.1 · Сотрудник склада<title>Кладовщику дать роль учета ТМЦ в складской 1С. Доступ к файлу базы ограничить. Записывать автора и номер измененного документа.</title></text>
      <text x="662.5" y="271.98" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Учесть ТМЦ</text>
      <text x="662.5" y="362.1" fill="#416681" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle">P07.2 · Сотрудник склада<title>Если в документе есть ФИО и телефон представителя поставщика, пометить эти поля как персональные данные. Контакты открывать сотруднику, ведущему закупку.</title></text>
      <text x="662.5" y="388.14" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="middle">Учесть закупку</text>
      <text x="662.5" y="415.14" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="middle">оборудования</text>
      <text x="1211.0" y="313.98" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle">1С:Торговля и склад</text>
      <text x="1211.0" y="336.1" fill="#415969" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle">Файловая база на сервере клиники</text>
      <text x="187.0" y="553.48" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle">1С:Бухгалтерия</text>
      <text x="187.0" y="581.48" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle">предприятия</text>
      <text x="187.0" y="603.6" fill="#415969" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle">Файловая база на сервере клиники</text>
      <text x="662.5" y="544.1" fill="#416681" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle">P07.3 · Платформа 1С<title>Задать разрешенные поля отдельно для каждого направления OLE. Использовать выделенную учетную запись с правами обмена. Сверять номер документа и результат загрузки.</title></text>
      <text x="662.5" y="570.14" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="middle">Обменяться данными</text>
      <text x="662.5" y="597.14" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="middle">через OLE</text>
      <text x="416.0" y="243.4" fill="#375A70" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle">Сведения о ТМЦ</text>
      <text x="416.0" y="373.4" fill="#375A70" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle">Сведения о закупке</text>
      <text x="916.0" y="243.4" fill="#375A70" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle">Запись о ТМЦ</text>
      <text x="916.0" y="373.4" fill="#375A70" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle">Запись о закупке</text>
      <text x="987.0" y="524.4" fill="#375A70" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle">Данные склада</text>
      <text x="416.0" y="524.4" fill="#375A70" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle">Данные склада</text>
      <text x="416.0" y="587.4" fill="#375A70" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle">Данные бухгалтерии</text>
      <text x="987.0" y="587.4" fill="#375A70" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle">Данные бухгалтерии</text>
      <text x="52" y="710.14" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="start">Какие данные проверить</text>
      <text x="729" y="710.14" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="start">Что известно об обмене</text>
      <text x="52" y="753.28" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">Сведения о ТМЦ и закупках — внутренние данные клиники.</text>
      <text x="729" y="753.28" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">Сейчас обмен по OLE работает в обе стороны. Стрелки подписаны</text>
      <text x="52" y="780.28" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">При аудите проверить, есть ли в документах ФИО и контакты</text>
      <text x="729" y="780.28" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">по источнику данных. Состав полей в каждом направлении</text>
      <text x="52" y="807.28" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">представителей поставщиков и кому доступны эти поля.</text>
      <text x="729" y="807.28" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">и периодичность обмена нужно уточнить у владельцев баз.</text>
    </g>
  </g>
  <g id="protection" font-family="Arial, Helvetica, sans-serif">
    <rect x="52" y="859" width="1316" height="1" fill="#9ABEB4" />
    <text x="52" y="892" fill="#155B51" font-size="24" font-weight="700">Предлагаемые меры по этапам</text>
    <g id="protection-1">
      <rect x="52" y="911" width="649" height="121" rx="8" fill="#F0F7F4" stroke="#AAC7BE" />
      <text x="68" y="936" fill="#155B51" font-size="18" font-weight="700">P07.1  ·  Складская запись</text>
      <text x="68" y="961" fill="#243F4A" font-size="16" font-weight="400">Кладовщику дать роль учета ТМЦ в складской 1С. Доступ к файлу базы</text>
      <text x="68" y="984" fill="#243F4A" font-size="16" font-weight="400">ограничить. Записывать автора и номер измененного документа.</text>
    </g>
    <g id="protection-2">
      <rect x="719" y="911" width="649" height="121" rx="8" fill="#F0F7F4" stroke="#AAC7BE" />
      <text x="735" y="936" fill="#155B51" font-size="18" font-weight="700">P07.2  ·  Документ закупки</text>
      <text x="735" y="961" fill="#243F4A" font-size="16" font-weight="400">Если в документе есть ФИО и телефон представителя поставщика,</text>
      <text x="735" y="984" fill="#243F4A" font-size="16" font-weight="400">пометить эти поля как персональные данные. Контакты открывать</text>
      <text x="735" y="1007" fill="#243F4A" font-size="16" font-weight="400">сотруднику, ведущему закупку.</text>
    </g>
    <g id="protection-3">
      <rect x="52" y="1050" width="649" height="121" rx="8" fill="#F0F7F4" stroke="#AAC7BE" />
      <text x="68" y="1075" fill="#155B51" font-size="18" font-weight="700">P07.3  ·  Обмен между базами</text>
      <text x="68" y="1100" fill="#243F4A" font-size="16" font-weight="400">Задать разрешенные поля отдельно для каждого направления OLE.</text>
      <text x="68" y="1123" fill="#243F4A" font-size="16" font-weight="400">Использовать выделенную учетную запись с правами обмена. Сверять</text>
      <text x="68" y="1146" fill="#243F4A" font-size="16" font-weight="400">номер документа и результат загрузки.</text>
    </g>
    <g id="protection-4">
      <rect x="719" y="1050" width="649" height="121" rx="8" fill="#F0F7F4" stroke="#AAC7BE" />
      <text x="735" y="1075" fill="#155B51" font-size="18" font-weight="700">Расхождения при обмене</text>
      <text x="735" y="1100" fill="#243F4A" font-size="16" font-weight="400">Записывать направление, номер документа, версию правил и итог</text>
      <text x="735" y="1123" fill="#243F4A" font-size="16" font-weight="400">загрузки. При появлении неизвестного поля остановить передачу этой</text>
      <text x="735" y="1146" fill="#243F4A" font-size="16" font-weight="400">записи до решения владельцев баз.</text>
    </g>
  </g>
</svg>