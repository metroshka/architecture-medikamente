<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="1090" viewBox="0 0 1300 1090" role="img" aria-labelledby="title desc" version="1.1" content="&lt;mxfile host=&quot;app.diagrams.net&quot; type=&quot;device&quot;&gt;&lt;diagram id=&quot;p02-protection&quot; name=&quot;P02. Меры защиты&quot;&gt;&lt;/diagram&gt;&lt;/mxfile&gt;">
  <title id="title">P02. Запись пациента на прием — потоки данных и предлагаемые меры защиты</title>
  <desc id="desc">Ресепшен вносит запись к специалисту в его Excel-журнал на общем диске. Из этого же журнала врач получает записи на просмотр и сохраняет в него правки. Пунктиром отмечено предполагаемое обращение пациента. Канал обращения и полный перечень полей неизвестны. Вверху показан исходный поток, внизу — предлагаемые меры по номерам операций.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 11 10" refX="10" refY="5" markerWidth="11" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#375A70" />
    </marker>
    <marker id="arrow-assumed" viewBox="0 0 11 10" refX="10" refY="5" markerWidth="11" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#895B29" />
    </marker>
  </defs>
  <rect x="0" y="0" width="1300" height="1090" fill="#FFFFFF" />
  <g font-family="Arial, Helvetica, sans-serif">
    <g id="lines">
      <polyline points="242,250 492,250" stroke="#895B29" fill="none" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow-assumed)" stroke-dasharray="8 5" />
      <polyline points="768,250 1119,250 1119,305" stroke="#375A70" fill="none" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow)" />
      <polyline points="990,374 768,374" stroke="#375A70" fill="none" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow)" />
      <polyline points="492,374 286,374 286,404 242,404" stroke="#375A70" fill="none" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow)" />
      <polyline points="242,449 286,449 286,488 492,488" stroke="#375A70" fill="none" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow)" />
      <polyline points="768,488 1119,488 1119,444" stroke="#375A70" fill="none" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow)" />
    </g>
    <g id="shapes">
      <rect x="52" y="155" width="1196" height="1" fill="#CEDADD" />
      <rect x="52" y="214" width="190" height="72" rx="0" fill="#F4F6F8" stroke="#6A8090" stroke-width="2" />
      <rect x="52" y="383" width="190" height="86" rx="0" fill="#F4F6F8" stroke="#6A8090" stroke-width="2" />
      <rect x="492" y="206" width="276" height="88" rx="12" fill="#ECF3FA" stroke="#507999" stroke-width="2" />
      <rect x="492" y="330" width="276" height="88" rx="12" fill="#ECF3FA" stroke="#507999" stroke-width="2" />
      <rect x="492" y="444" width="276" height="88" rx="12" fill="#ECF3FA" stroke="#507999" stroke-width="2" />
      <path d="M 990 318 C 990 300.6666666666667 1248 300.6666666666667 1248 318 L 1248 431 C 1248 448.3333333333333 990 448.3333333333333 990 431 Z" fill="#E7F4EE" stroke="#398277" stroke-width="2" />
      <path d="M 990 318 C 990 335.29 1248 335.29 1248 318" fill="none" stroke="#398277" stroke-width="1.4" />
      <rect x="52" y="557" width="1196" height="1" fill="#CEDADD" />
    </g>
    <g id="captions">
      <text x="52" y="39.44" fill="#206962" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start">Медикаменте  /  P02  /  Сверху — исходный поток, снизу — предлагаемые меры по номерам операций</text>
      <text x="50" y="91.26" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="39" font-weight="700" text-anchor="start">P02. Запись пациента на прием</text>
      <text x="52" y="131.8" fill="#415969" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">Ресепшен вносит запись в Excel-журнал выбранного врача. Врач просматривает и редактирует свой журнал.</text>
      <text x="52" y="185.6" fill="#415969" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="start">Участники</text>
      <text x="492" y="185.6" fill="#415969" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="start">Ручные операции</text>
      <text x="990" y="185.6" fill="#415969" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="start">Хранилище</text>
      <text x="147.0" y="257.82" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="middle">Пациент</text>
      <text x="147.0" y="433.82" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="middle">Врач</text>
      <text x="630.0" y="241.6" fill="#416681" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle">P02.1 · Ресепшен<title>Ресепшен вносит пациента, врача и время. Для обзвона предоставить отдельный список на день. В общей сводке расписания оставить последние четыре цифры телефона.</title></text>
      <text x="630.0" y="267.64" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="middle">Внести запись к врачу</text>
      <text x="630.0" y="365.6" fill="#416681" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle">P02.2 · Врач<title>Выдать врачу права на файл его расписания через группу Active Directory. Доступ на время замещения согласовать и отозвать по окончании замены.</title></text>
      <text x="630.0" y="391.64" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="middle">Открыть журнал</text>
      <text x="630.0" y="479.6" fill="#416681" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle">P02.3 · Врач<title>Разрешить правку своего журнала врачу и ресепшену. Включить аудит записи файла и хранить предыдущую версию книги, чтобы сверить измененный прием.</title></text>
      <text x="630.0" y="505.64" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="middle">Сохранить правки</text>
      <text x="1119.0" y="365.98" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Excel-журнал врача</text>
      <text x="1119.0" y="386.42" fill="#235C51" font-family="Courier New, monospace" font-size="13" font-weight="400" text-anchor="middle">Journals/Journal-Doctor-FIO 1</text>
      <text x="1119.0" y="407.1" fill="#345F57" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle">Общий файловый сервер</text>
      <text x="367.0" y="239.4" fill="#895B29" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle">Сведения для записи</text>
      <text x="939.0" y="239.4" fill="#375A70" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle">Запись пациента к врачу</text>
      <text x="879.0" y="363.4" fill="#375A70" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle">Данные журнала</text>
      <text x="388.0" y="363.4" fill="#375A70" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle">Записи на прием</text>
      <text x="382.0" y="477.4" fill="#375A70" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle">Правки врача</text>
      <text x="939.0" y="477.4" fill="#375A70" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle">Измененная запись</text>
      <text x="52" y="598.64" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="start">Конфиденциальные данные</text>
      <text x="665" y="598.64" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="start">Доступ и допущения</text>
      <text x="52" y="633.44" fill="#206962" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start">D01</text>
      <text x="104" y="633.78" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">Сведения, по которым можно узнать пациента.</text>
      <text x="52" y="662.44" fill="#206962" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start">D03</text>
      <text x="104" y="662.78" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">Запись пациента на прием к конкретному врачу.</text>
      <text x="52" y="691.44" fill="#206962" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start">D12</text>
      <text x="104" y="691.78" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">Ф. И. О. врача в имени файла журнала.</text>
      <text x="665" y="634.28" fill="#415969" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">Сотрудники входят под доменной учетной записью.</text>
      <text x="665" y="658.28" fill="#415969" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">Сейчас просмотры и изменения журнала не регистрируются.</text>
      <text x="665" y="695.28" fill="#895B29" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">Пунктир — предполагаемое обращение пациента.</text>
      <text x="665" y="719.28" fill="#415969" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">Канал обращения и точный состав полей Excel не указаны.</text>
    </g>
  </g>
  <g id="protection" font-family="Arial, Helvetica, sans-serif">
    <rect x="52" y="746" width="1196" height="1" fill="#9ABEB4" />
    <text x="52" y="779" fill="#155B51" font-size="24" font-weight="700">Предлагаемые меры по этапам</text>
    <g id="protection-1">
      <rect x="52" y="798" width="589" height="121" rx="8" fill="#F0F7F4" stroke="#AAC7BE" />
      <text x="68" y="823" fill="#155B51" font-size="18" font-weight="700">P02.1  ·  Запись на прием</text>
      <text x="68" y="848" fill="#243F4A" font-size="16" font-weight="400">Ресепшен вносит пациента, врача и время. Для обзвона</text>
      <text x="68" y="871" fill="#243F4A" font-size="16" font-weight="400">предоставить отдельный список на день. В общей сводке</text>
      <text x="68" y="894" fill="#243F4A" font-size="16" font-weight="400">расписания оставить последние четыре цифры телефона.</text>
    </g>
    <g id="protection-2">
      <rect x="659" y="798" width="589" height="121" rx="8" fill="#F0F7F4" stroke="#AAC7BE" />
      <text x="675" y="823" fill="#155B51" font-size="18" font-weight="700">P02.2  ·  Просмотр журнала</text>
      <text x="675" y="848" fill="#243F4A" font-size="16" font-weight="400">Выдать врачу права на файл его расписания через группу</text>
      <text x="675" y="871" fill="#243F4A" font-size="16" font-weight="400">Active Directory. Доступ на время замещения согласовать и</text>
      <text x="675" y="894" fill="#243F4A" font-size="16" font-weight="400">отозвать по окончании замены.</text>
    </g>
    <g id="protection-3">
      <rect x="52" y="937" width="589" height="121" rx="8" fill="#F0F7F4" stroke="#AAC7BE" />
      <text x="68" y="962" fill="#155B51" font-size="18" font-weight="700">P02.3  ·  Исправление записи</text>
      <text x="68" y="987" fill="#243F4A" font-size="16" font-weight="400">Разрешить правку своего журнала врачу и ресепшену. Включить</text>
      <text x="68" y="1010" fill="#243F4A" font-size="16" font-weight="400">аудит записи файла и хранить предыдущую версию книги, чтобы</text>
      <text x="68" y="1033" fill="#243F4A" font-size="16" font-weight="400">сверить измененный прием.</text>
    </g>
    <g id="protection-4">
      <rect x="659" y="937" width="589" height="121" rx="8" fill="#F0F7F4" stroke="#AAC7BE" />
      <text x="675" y="962" fill="#155B51" font-size="18" font-weight="700">Передача расписания</text>
      <text x="675" y="987" fill="#243F4A" font-size="16" font-weight="400">Открывать книгу с сервера по защищенному SMB-соединению.</text>
      <text x="675" y="1010" fill="#243F4A" font-size="16" font-weight="400">Для передачи части расписания сформировать отдельный файл с</text>
      <text x="675" y="1033" fill="#243F4A" font-size="16" font-weight="400">разрешенными строками и полями.</text>
    </g>
  </g>
</svg>