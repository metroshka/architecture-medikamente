<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="1203" viewBox="0 0 1420 1203" role="img" aria-labelledby="title desc" version="1.1" content="&lt;mxfile host=&quot;app.diagrams.net&quot; type=&quot;device&quot;&gt;&lt;diagram id=&quot;p06-protection&quot; name=&quot;P06. Меры защиты&quot;&gt;&lt;/diagram&gt;&lt;/mxfile&gt;">
  <title id="title">P06. Бухгалтерский и кадровый учет — потоки данных и предлагаемые меры защиты</title>
  <desc id="desc">Бухгалтер ведет кадровые записи в файловой базе 1С:Бухгалтерия предприятия. В той же базе учитываются платежи пациентов из P05. При расчете зарплаты бухгалтер использует сведения о сотруднике, отражает начисление в 1С и получает данные для выплаты. На основе данных бухучета бухгалтер готовит документы для налоговых органов. Пунктир показывает возможную передачу адресату. Канал подачи и способ выплаты не указаны. Вверху показан исходный поток, внизу — предлагаемые меры по номерам операций.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 11 10" refX="10" refY="5" markerWidth="11" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#375A70" />
    </marker>
    <marker id="arrow-assumed" viewBox="0 0 11 10" refX="10" refY="5" markerWidth="11" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#895B29" />
    </marker>
  </defs>
  <rect x="0" y="0" width="1420" height="1203" fill="#FFFFFF" />
  <g font-family="Arial, Helvetica, sans-serif">
    <g id="lines">
      <polyline points="288,304 322,304 322,254 503,254" stroke="#375A70" fill="none" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow)" />
      <polyline points="805,254 1211,254 1211,332" stroke="#375A70" fill="none" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow)" />
      <polyline points="1054,381 805,381" stroke="#375A70" fill="none" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow)" />
      <polyline points="805,433 1054,433" stroke="#375A70" fill="none" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow)" />
      <polyline points="503,405 322,405 322,352 288,352" stroke="#375A70" fill="none" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow)" />
      <polyline points="1211,478 1211,565 805,565" stroke="#375A70" fill="none" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow)" />
      <polyline points="563.4,520 563.4,476 158.2,476 158.2,377" stroke="#375A70" fill="none" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow)" />
      <polyline points="503,565 288,565" stroke="#895B29" fill="none" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow-assumed)" stroke-dasharray="8 5" />
    </g>
    <g id="shapes">
      <rect x="52" y="155" width="1316" height="1" fill="#CEDADD" />
      <rect x="52" y="283" width="236" height="94" rx="0" fill="#F4F6F8" stroke="#6A8090" stroke-width="2" />
      <rect x="52" y="521" width="236" height="88" rx="0" fill="#F4F6F8" stroke="#6A8090" stroke-width="2" />
      <rect x="503" y="212" width="302" height="84" rx="12" fill="#ECF3FA" stroke="#507999" stroke-width="2" />
      <rect x="503" y="356" width="302" height="98" rx="12" fill="#ECF3FA" stroke="#507999" stroke-width="2" />
      <rect x="503" y="520" width="302" height="90" rx="12" fill="#ECF3FA" stroke="#507999" stroke-width="2" />
      <path d="M 1054 345 C 1054 327.6666666666667 1368 327.6666666666667 1368 345 L 1368 465 C 1368 482.3333333333333 1054 482.3333333333333 1054 465 Z" fill="#E7F4EE" stroke="#398277" stroke-width="2" />
      <path d="M 1054 345 C 1054 362.29 1368 362.29 1368 345" fill="none" stroke="#398277" stroke-width="1.4" />
      <rect x="52" y="643" width="1316" height="1" fill="#CEDADD" />
      <line x1="732" y1="724" x2="774" y2="724" stroke="#375A70" stroke-width="2" marker-end="url(#arrow)" />
      <line x1="732" y1="756" x2="774" y2="756" stroke="#895B29" stroke-width="2" marker-end="url(#arrow-assumed)" stroke-dasharray="7 5" />
    </g>
    <g id="captions">
      <text x="52" y="39.44" fill="#206962" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start">Медикаменте  /  P06  /  Сверху — исходный поток, снизу — предлагаемые меры по номерам операций</text>
      <text x="50" y="91.26" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="39" font-weight="700" text-anchor="start">P06. Бухгалтерский и кадровый учет</text>
      <text x="52" y="131.8" fill="#415969" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">Сейчас бухгалтерия работает в той же файловой базе 1С, в которой в P05 учитываются платежи пациентов.</text>
      <text x="52" y="185.6" fill="#415969" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="start">Участники</text>
      <text x="503" y="185.6" fill="#415969" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="start">Операции в 1С</text>
      <text x="1054" y="185.6" fill="#415969" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="start">Хранилище клиники</text>
      <text x="170.0" y="337.82" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="middle">Бухгалтер</text>
      <text x="170.0" y="561.98" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Налоговый орган</text>
      <text x="170.0" y="584.1" fill="#415969" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle">Адресат документов</text>
      <text x="654.0" y="245.6" fill="#416681" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle">P06.1 · Бухгалтер<title>Разрешить изменение назначенному бухгалтеру. Ограничить доступ к файлу базы на сервере, зашифровать том и резервные копии. Кассиру оставить учет оплат.</title></text>
      <text x="654.0" y="271.64" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="middle">Вести кадровый учет</text>
      <text x="654.0" y="396.6" fill="#416681" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle">P06.2 · Бухгалтер<title>Выделить роль расчета зарплаты в 1С. Ведомость хранить в закрытой папке бухгалтерии. Фиксировать формирование и выдачу выгрузки по ее номеру.</title></text>
      <text x="654.0" y="422.64" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="middle">Начислить зарплату</text>
      <text x="654.0" y="544.1" fill="#416681" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle">P06.3 · Бухгалтер<title>Включить в выгрузку поля утвержденной формы. До передачи проверить получателя и канал подачи. Хранить экземпляр и подтверждение отправки с правами бухгалтерии.</title></text>
      <text x="654.0" y="569.3" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Подготовить налоговые</text>
      <text x="654.0" y="595.3" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="middle">документы</text>
      <text x="1211.0" y="391.98" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle">1С:Бухгалтерия</text>
      <text x="1211.0" y="419.98" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle">предприятия</text>
      <text x="1211.0" y="442.1" fill="#415969" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle">Файловая база на сервере клиники</text>
      <text x="412.0" y="243.4" fill="#375A70" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle">Кадровые сведения</text>
      <text x="1008.0" y="243.4" fill="#375A70" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle">Запись о сотруднике</text>
      <text x="929.5" y="370.4" fill="#375A70" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle">Данные для расчета</text>
      <text x="929.5" y="422.4" fill="#375A70" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle">Начисление по сотруднику</text>
      <text x="414.0" y="394.4" fill="#375A70" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle">Данные для выплаты</text>
      <text x="1008.0" y="554.4" fill="#375A70" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle">Сведения бухгалтерского учета</text>
      <text x="360.4" y="465.4" fill="#375A70" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle">Готовые документы</text>
      <text x="395.5" y="554.4" fill="#895B29" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle">Комплект к подаче</text>
      <text x="52" y="687.14" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="start">Конфиденциальные данные</text>
      <text x="732" y="687.14" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="start">Как читать схему</text>
      <text x="52" y="731.78" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">Кадровая запись связывает конкретного сотрудника с его зарплатой.</text>
      <text x="52" y="758.78" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">Для аудита нужно выяснить, по каким реквизитам связаны записи</text>
      <text x="52" y="785.78" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">и кто может читать или менять индивидуальные начисления.</text>
      <text x="788" y="729.78" fill="#375A70" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">Бухгалтерия обрабатывает данные в 1С.</text>
      <text x="788" y="761.78" fill="#895B29" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">Возможная передача комплекта налоговому органу.</text>
      <text x="732" y="803.28" fill="#415969" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">Состав отчетности, канал подачи и способ выплаты зарплаты</text>
      <text x="732" y="827.28" fill="#415969" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">в описании клиники не указаны.</text>
    </g>
  </g>
  <g id="protection" font-family="Arial, Helvetica, sans-serif">
    <rect x="52" y="859" width="1316" height="1" fill="#9ABEB4" />
    <text x="52" y="892" fill="#155B51" font-size="24" font-weight="700">Предлагаемые меры по этапам</text>
    <g id="protection-1">
      <rect x="52" y="911" width="649" height="121" rx="8" fill="#F0F7F4" stroke="#AAC7BE" />
      <text x="68" y="936" fill="#155B51" font-size="18" font-weight="700">P06.1  ·  Кадровая запись</text>
      <text x="68" y="961" fill="#243F4A" font-size="16" font-weight="400">Разрешить изменение назначенному бухгалтеру. Ограничить доступ к</text>
      <text x="68" y="984" fill="#243F4A" font-size="16" font-weight="400">файлу базы на сервере, зашифровать том и резервные копии. Кассиру</text>
      <text x="68" y="1007" fill="#243F4A" font-size="16" font-weight="400">оставить учет оплат.</text>
    </g>
    <g id="protection-2">
      <rect x="719" y="911" width="649" height="121" rx="8" fill="#F0F7F4" stroke="#AAC7BE" />
      <text x="735" y="936" fill="#155B51" font-size="18" font-weight="700">P06.2  ·  Начисление зарплаты</text>
      <text x="735" y="961" fill="#243F4A" font-size="16" font-weight="400">Выделить роль расчета зарплаты в 1С. Ведомость хранить в закрытой</text>
      <text x="735" y="984" fill="#243F4A" font-size="16" font-weight="400">папке бухгалтерии. Фиксировать формирование и выдачу выгрузки по</text>
      <text x="735" y="1007" fill="#243F4A" font-size="16" font-weight="400">ее номеру.</text>
    </g>
    <g id="protection-3">
      <rect x="52" y="1050" width="649" height="121" rx="8" fill="#F0F7F4" stroke="#AAC7BE" />
      <text x="68" y="1075" fill="#155B51" font-size="18" font-weight="700">P06.3  ·  Налоговые документы</text>
      <text x="68" y="1100" fill="#243F4A" font-size="16" font-weight="400">Включить в выгрузку поля утвержденной формы. До передачи проверить</text>
      <text x="68" y="1123" fill="#243F4A" font-size="16" font-weight="400">получателя и канал подачи. Хранить экземпляр и подтверждение</text>
      <text x="68" y="1146" fill="#243F4A" font-size="16" font-weight="400">отправки с правами бухгалтерии.</text>
    </g>
    <g id="protection-4">
      <rect x="719" y="1050" width="649" height="121" rx="8" fill="#F0F7F4" stroke="#AAC7BE" />
      <text x="735" y="1075" fill="#155B51" font-size="18" font-weight="700">Рабочие копии</text>
      <text x="735" y="1100" fill="#243F4A" font-size="16" font-weight="400">Проверять, какие ведомости и комплекты отчетности остаются вне</text>
      <text x="735" y="1123" fill="#243F4A" font-size="16" font-weight="400">базы. Для каждой копии определить владельца и срок хранения, по</text>
      <text x="735" y="1146" fill="#243F4A" font-size="16" font-weight="400">его окончании зафиксировать удаление.</text>
    </g>
  </g>
</svg>