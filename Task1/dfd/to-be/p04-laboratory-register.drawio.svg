<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1183" viewBox="0 0 1400 1183" role="img" aria-labelledby="title desc" version="1.1" content="&lt;mxfile host=&quot;app.diagrams.net&quot; type=&quot;device&quot;&gt;&lt;diagram id=&quot;p04-protection&quot; name=&quot;P04. Меры защиты&quot;&gt;&lt;/diagram&gt;&lt;/mxfile&gt;">
  <title id="title">P04. Учет анализов — потоки данных и предлагаемые меры защиты</title>
  <desc id="desc">Сотрудник клиники вручную ведет дневной реестр анализов RegistryByDate в Excel на общем диске. Лаборатория — внешний участник. Передача направления, получение результата и его передача врачу показаны пунктиром как возможные маршруты. Состав реестра, текущий канал обмена и место хранения результатов неизвестны. Вверху показан исходный поток, внизу — предлагаемые меры по номерам операций.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 11 10" refX="10" refY="5" markerWidth="11" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#375A70" />
    </marker>
    <marker id="arrow-assumed" viewBox="0 0 11 10" refX="10" refY="5" markerWidth="11" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#895B29" />
    </marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1183" fill="#FFFFFF" />
  <g font-family="Arial, Helvetica, sans-serif">
    <g id="lines">
      <polyline points="284,256 504,256" stroke="#375A70" fill="none" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow)" />
      <polyline points="788,256 1002,256" stroke="#375A70" fill="none" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow)" />
      <polyline points="168,298 168,428 504,428" stroke="#895B29" fill="none" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow-assumed)" stroke-dasharray="8 5" />
      <polyline points="788,428 1002,428" stroke="#895B29" fill="none" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow-assumed)" stroke-dasharray="8 5" />
      <polyline points="1162,515 1162,589 788,589" stroke="#895B29" fill="none" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow-assumed)" stroke-dasharray="8 5" />
      <polyline points="504,589 284,589" stroke="#895B29" fill="none" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow-assumed)" stroke-dasharray="8 5" />
    </g>
    <g id="shapes">
      <rect x="52" y="155" width="1296" height="1" fill="#CEDADD" />
      <rect x="976" y="348" width="372" height="202" rx="8" fill="none" stroke="#BBCDD3" stroke-width="1.2" />
      <rect x="52" y="214" width="232" height="84" rx="0" fill="#F4F6F8" stroke="#6A8090" stroke-width="2" />
      <rect x="52" y="547" width="232" height="84" rx="0" fill="#F4F6F8" stroke="#6A8090" stroke-width="2" />
      <rect x="504" y="214" width="284" height="84" rx="12" fill="#ECF3FA" stroke="#507999" stroke-width="2" />
      <rect x="504" y="386" width="284" height="84" rx="12" fill="#ECF3FA" stroke="#507999" stroke-width="2" />
      <rect x="504" y="547" width="284" height="84" rx="12" fill="#ECF3FA" stroke="#507999" stroke-width="2" />
      <path d="M 1002 213 C 1002 195.66666666666666 1348 195.66666666666666 1348 213 L 1348 313 C 1348 330.3333333333333 1002 330.3333333333333 1002 313 Z" fill="#E7F4EE" stroke="#398277" stroke-width="2" />
      <path d="M 1002 213 C 1002 230.29 1348 230.29 1348 213" fill="none" stroke="#398277" stroke-width="1.4" />
      <rect x="1002" y="401" width="320" height="114" rx="0" fill="#F4F6F8" stroke="#6A8090" stroke-width="2" />
      <rect x="52" y="654" width="1296" height="1" fill="#CEDADD" />
      <line x1="732" y1="730" x2="774" y2="730" stroke="#375A70" stroke-width="2" marker-end="url(#arrow)" />
      <line x1="732" y1="761" x2="774" y2="761" stroke="#895B29" stroke-width="2" marker-end="url(#arrow-assumed)" stroke-dasharray="7 5" />
    </g>
    <g id="captions">
      <text x="52" y="39.44" fill="#206962" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start">Медикаменте  /  P04  /  Сверху — исходный поток, снизу — предлагаемые меры по номерам операций</text>
      <text x="50" y="91.26" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="39" font-weight="700" text-anchor="start">P04. Учет анализов</text>
      <text x="52" y="131.8" fill="#415969" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">Сейчас дневной реестр анализов ведут вручную в Excel. Как клиника обменивается данными с лабораторией, предстоит уточнить.</text>
      <text x="52" y="185.6" fill="#415969" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="start">Участники клиники</text>
      <text x="504" y="185.6" fill="#415969" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="start">Операции с данными</text>
      <text x="1002" y="185.6" fill="#415969" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="start">Общий файловый сервер</text>
      <text x="1002" y="375.6" fill="#415969" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="start">За пределами клиники</text>
      <text x="168.0" y="252.98" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Сотрудник клиники</text>
      <text x="168.0" y="275.1" fill="#415969" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle">Должность не указана</text>
      <text x="168.0" y="586.32" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="middle">Врач</text>
      <text x="168.0" y="608.6" fill="#415969" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle">Возможный получатель</text>
      <text x="646.0" y="247.6" fill="#416681" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle">P04.1 · Ручной учет<title>Присвоить направлению номер. В реестре хранить поля для учета, а соответствие номера пациенту закрыть отдельными правами. Ограничить доступ к дневному списку.</title></text>
      <text x="646.0" y="273.64" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="middle">Внести запись в реестр</text>
      <text x="646.0" y="419.6" fill="#895B29" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle">P04.2 · Допущение<title>Согласовать с лабораторией поля для идентификации исследования и пробы. Передавать одно направление по защищенному каналу с проверкой обеих сторон.</title></text>
      <text x="646.0" y="445.64" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="middle">Передать направление</text>
      <text x="646.0" y="580.6" fill="#895B29" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle">P04.3 · Допущение<title>Проверить отправителя и номер направления, по нему определить пациента. При расхождении отложить результат на разбор. Доступ подтвердить по назначению врача.</title></text>
      <text x="646.0" y="606.64" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="middle">Принять результат</text>
      <text x="1175.0" y="253.98" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Реестр анализов за день</text>
      <text x="1175.0" y="275.26" fill="#206962" font-family="Courier New, monospace" font-size="14" font-weight="400" text-anchor="middle">Laboratory Registry/RegistryByDate</text>
      <text x="1175.0" y="296.1" fill="#415969" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle">Excel на общем диске клиники</text>
      <text x="1162.0" y="454.64" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="middle">Медицинская лаборатория</text>
      <text x="1162.0" y="476.6" fill="#415969" font-family="Courier New, monospace" font-size="15" font-weight="400" text-anchor="middle">Laboratory</text>
      <text x="394.0" y="245.4" fill="#375A70" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle">Сведения об анализе</text>
      <text x="895.0" y="245.4" fill="#375A70" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle">Строка реестра</text>
      <text x="329.0" y="417.4" fill="#895B29" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle">Данные для направления</text>
      <text x="895.0" y="417.4" fill="#895B29" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle">Направление на анализ</text>
      <text x="983.0" y="578.4" fill="#895B29" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle">Результат исследования</text>
      <text x="394.0" y="578.4" fill="#895B29" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle">Результат для врача</text>
      <text x="52" y="698.14" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="start">Конфиденциальные данные</text>
      <text x="732" y="698.14" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="start">Как читать схему</text>
      <text x="52" y="735.28" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">Результат можно связать с пациентом по Ф. И. О. или по номеру</text>
      <text x="52" y="762.28" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">направления, если известно, кому оно выдано.</text>
      <text x="52" y="789.28" fill="#18354A" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">Состав колонок реестра и место хранения результатов неизвестны.</text>
      <text x="788" y="735.78" fill="#375A70" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">Подтвержденный ручной учет в Excel.</text>
      <text x="788" y="766.78" fill="#895B29" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">Предполагаемый маршрут или получатель.</text>
      <text x="732" y="803.28" fill="#415969" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">Уточнить канал передачи и способ привязки результата к пациенту.</text>
    </g>
  </g>
  <g id="protection" font-family="Arial, Helvetica, sans-serif">
    <rect x="52" y="839" width="1296" height="1" fill="#9ABEB4" />
    <text x="52" y="872" fill="#155B51" font-size="24" font-weight="700">Предлагаемые меры по этапам</text>
    <g id="protection-1">
      <rect x="52" y="891" width="639" height="121" rx="8" fill="#F0F7F4" stroke="#AAC7BE" />
      <text x="68" y="916" fill="#155B51" font-size="18" font-weight="700">P04.1  ·  Дневной реестр</text>
      <text x="68" y="941" fill="#243F4A" font-size="16" font-weight="400">Присвоить направлению номер. В реестре хранить поля для учета, а</text>
      <text x="68" y="964" fill="#243F4A" font-size="16" font-weight="400">соответствие номера пациенту закрыть отдельными правами.</text>
      <text x="68" y="987" fill="#243F4A" font-size="16" font-weight="400">Ограничить доступ к дневному списку.</text>
    </g>
    <g id="protection-2">
      <rect x="709" y="891" width="639" height="121" rx="8" fill="#F0F7F4" stroke="#AAC7BE" />
      <text x="725" y="916" fill="#155B51" font-size="18" font-weight="700">P04.2  ·  Направление в лабораторию</text>
      <text x="725" y="941" fill="#243F4A" font-size="16" font-weight="400">Согласовать с лабораторией поля для идентификации исследования и</text>
      <text x="725" y="964" fill="#243F4A" font-size="16" font-weight="400">пробы. Передавать одно направление по защищенному каналу с</text>
      <text x="725" y="987" fill="#243F4A" font-size="16" font-weight="400">проверкой обеих сторон.</text>
    </g>
    <g id="protection-3">
      <rect x="52" y="1030" width="639" height="121" rx="8" fill="#F0F7F4" stroke="#AAC7BE" />
      <text x="68" y="1055" fill="#155B51" font-size="18" font-weight="700">P04.3  ·  Прием результата</text>
      <text x="68" y="1080" fill="#243F4A" font-size="16" font-weight="400">Проверить отправителя и номер направления, по нему определить</text>
      <text x="68" y="1103" fill="#243F4A" font-size="16" font-weight="400">пациента. При расхождении отложить результат на разбор. Доступ</text>
      <text x="68" y="1126" fill="#243F4A" font-size="16" font-weight="400">подтвердить по назначению врача.</text>
    </g>
    <g id="protection-4">
      <rect x="709" y="1030" width="639" height="121" rx="8" fill="#F0F7F4" stroke="#AAC7BE" />
      <text x="725" y="1055" fill="#155B51" font-size="18" font-weight="700">Выдача результата</text>
      <text x="725" y="1080" fill="#243F4A" font-size="16" font-weight="400">Присвоить результату медицинскую метку. Перед выдачей сверить</text>
      <text x="725" y="1103" fill="#243F4A" font-size="16" font-weight="400">пациента и врача. В журнале оставить идентификатор документа,</text>
      <text x="725" y="1126" fill="#243F4A" font-size="16" font-weight="400">отправителя, получателя и решение.</text>
    </g>
  </g>
</svg>